name = "my-nuxt-app"
pages_build_output_dir = "./dist"
compatibility_date = "2026-08-29"
compatibility_flags = ["nodejs_compat"]

# 普通环境变量（非敏感：URL、云名、账号 ID、AppID）
[vars]
# 登录服务地址（本地/线上统一走线上的 auth-center）
LOGIN_BASE = "https://zkchat.dpdns.org"
# Upstash Redis REST 地址（Token 是敏感信息，用 secret 设置）
UPSTASH_REDIS_REST_URL = "https://growing-hen-38395.upstash.io"
# DeepSeek API 地址
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
# Agent API 地址
NUXT_AGENT_BASE_URL = "https://chief-agent-alpha.vercel.app"
# Cloudinary 云名（API Key/Secret 是敏感信息，用 secret 设置）
CLOUDINARY_CLOUD_NAME = "dlji1nmdj"
# Cloudflare 账号 ID（非机密；NUXT_ 前缀自动映射到 runtimeConfig.cloudflare.accountId，Token 用 secret 设置）
NUXT_CLOUDFLARE_ACCOUNT_ID = "65844ae2478b17ef0b07680420bc454f"
# 阿里百炼 API 地址
DASHSCOPE_BASE_URL = "https://dashscope.aliyuncs.com/api/v1"
# 百度翻译 AppID（AppKey 是敏感信息，用 secret 设置）
BAIDU_APPID = "20260815002666664"
# 高德地图 Web 端 Key（JS API 设计上前端公开，靠高德控制台域名白名单防护）
VITE_AMAP_KEY = "74308dcc0a8d524936a1468fe6599e13"
VITE_AMAP_SECURITY_CODE = "948b43075553eea53be2fe9fd9714ea6"
# 前端要连的 Socket 地址（本地开发用 localhost；生产环境在 Pages Dashboard 覆盖为公网地址）
NUXT_PUBLIC_SOCKET_URL = "http://localhost:5555"

