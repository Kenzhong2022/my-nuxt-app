name = "my-nuxt-app"
pages_build_output_dir = "./dist"
compatibility_date = "2026-08-29"
compatibility_flags = ["nodejs_compat"]

# 普通环境变量（非敏感：URL、云名、账号 ID、AppID）
[vars]
# 登录服务地址（线上部署用 auth-center，本地开发改为 http://localhost:3001）
LOGIN_BASE = "https://auth-center.netlify.app"
# Upstash Redis REST 地址（Token 是敏感信息，用 secret 设置）
UPSTASH_REDIS_REST_URL = "https://growing-hen-38395.upstash.io"
# DeepSeek API 地址
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
# Agent API 地址
NUXT_AGENT_BASE_URL = "https://chief-agent-alpha.vercel.app"
# Cloudinary 云名（API Key/Secret 是敏感信息，用 secret 设置）
CLOUDINARY_CLOUD_NAME = "dlji1nmdj"
# Cloudflare 账号 ID（不是机密，Token 才是）
CLOUDFLARE_ACCOUNT_ID = "65844ae2478b17ef0b07680420bc454f"
# 阿里百炼 API 地址
DASHSCOPE_BASE_URL = "https://dashscope.aliyuncs.com/api/v1"
# 百度翻译 AppID（AppKey 是敏感信息，用 secret 设置）
BAIDU_APPID = "20260815002666664"

# 敏感变量不要写在这里，逐条执行以下命令（会交互式提示输入值）：
# npx wrangler pages secret put UPSTASH_REDIS_REST_TOKEN --project-name=my-nuxt-app
# npx wrangler pages secret put DEEPSEEK_API_KEY --project-name=my-nuxt-app
# npx wrangler pages secret put NUXT_DATABASE_URL --project-name=my-nuxt-app
# npx wrangler pages secret put NUXT_JWT_ACCESS_SECRET --project-name=my-nuxt-app
# npx wrangler pages secret put NUXT_JWT_REFRESH_SECRET --project-name=my-nuxt-app
# npx wrangler pages secret put CLOUDINARY_API_KEY --project-name=my-nuxt-app
# npx wrangler pages secret put CLOUDINARY_API_SECRET --project-name=my-nuxt-app
# npx wrangler pages secret put CLOUDFLARE_WORKERS_AI_TOKEN --project-name=my-nuxt-app
# npx wrangler pages secret put DASHSCOPE_API_KEY --project-name=my-nuxt-app
# npx wrangler pages secret put BAIDU_APPKEY --project-name=my-nuxt-app

